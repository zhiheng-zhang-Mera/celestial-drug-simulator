<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' qrc: data:; script-src 'self' qrc: 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>解剖舞台 · 人体分层视图</title>
<style>
  :root {
    --ink: #0C0D0F;
    --panel: #121316;
    --surface: #16171A;
    --line: rgba(255, 255, 255, 0.07);
    --line-strong: rgba(255, 255, 255, 0.14);
    --text: #F3F1EB;
    --text-2: #B9B5AC;
    --text-3: #8A867E;
    --accent: #74E3C8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--text-2);
    font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    line-height: 1.5;
    overflow: hidden;
  }

  #app {
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    height: 100vh;
  }

  .dashboard {
    background: var(--ink);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #2A2C30 var(--ink);
  }
  .dashboard::-webkit-scrollbar { width: 8px; }
  .dashboard::-webkit-scrollbar-thumb { background: #2A2C30; border-radius: 4px; }

  .dash-head { padding: 12px 16px 10px; }
  .eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-3);
  }
  .dash-head .sub { font-size: 11px; color: var(--text-2); margin-top: 3px; }
  .sex-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
  }
  .sex-row label { font-size: 10px; color: var(--text-3); flex: none; }
  .sex-row select { flex: 1; width: auto; margin: 0; }

  .group {
    padding: 10px 16px 12px;
    border-top: 1px solid var(--line);
  }
  .group h3 {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-3);
    margin-bottom: 9px;
  }
  details.group > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-3);
    padding: 2px 0;
  }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary::after { content: "▾"; color: var(--text-3); }
  details.group[open] > summary::after { content: "▴"; }
  details.group[open] > summary { margin-bottom: 9px; }

  .layers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px 6px;
  }
  .sys-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    padding: 3px 6px;
    margin: 0;
    border-radius: 5px;
  }
  .sys-item:hover { background: rgba(255, 255, 255, 0.035); }
  .sys-item-left {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-2);
    min-width: 0;
  }
  .color-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .depth-badge { font-size: 10px; color: var(--text-3); }

  input[type="checkbox"] {
    width: 14px;
    height: 14px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .slider-wrap { margin: 9px 0; }
  .slider-wrap label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-2);
    margin-bottom: 5px;
  }
  .slider-wrap label span { color: var(--text-3); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 11px; }
  .btn {
    padding: 7px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.22); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  select {
    width: 100%;
    background: #101113;
    color: var(--text);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 6px 8px;
    margin: 5px 0;
    font-size: 11px;
    font-family: inherit;
  }
  select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .mini-label { display: block; font-size: 10px; color: var(--text-3); margin-top: 9px; }

  #source-legend {
    font-size: 10px;
    color: var(--text-3);
    margin-top: 8px;
    line-height: 1.55;
  }

  .info { border-top: 1px solid var(--line); padding: 12px 16px 14px; }
  #info h4 { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  #info p { font-size: 10.5px; line-height: 1.65; color: var(--text-3); margin-top: 3px; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .tag {
    font-size: 10px;
    color: var(--text-3);
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 1px;
  }

  #canvas-wrap { position: relative; min-width: 0; min-height: 0; background: var(--ink); }
  #three-canvas { width: 100%; height: 100%; display: block; }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    max-width: 88%;
    text-align: center;
    padding: 7px 14px;
    background: rgba(12, 13, 15, 0.72);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 10px;
    color: var(--text-3);
    pointer-events: none;
  }
  .loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text-3);
    font-size: 11px;
    letter-spacing: 0.08em;
  }
  #viewport-status {
    position: absolute;
    right: 14px;
    top: 12px;
    font-size: 10px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  /* 矮窗口下隐藏与右侧证据面板重复的区域说明，避免图层控制被挤进滚动区。 */
  @media (max-height: 560px) {
    #info { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <aside class="dashboard">
    <section class="group">
      <h3>显示模式</h3>
      <select id="region-select" aria-label="区域目录" hidden></select>
      <button class="btn" style="width:100%" id="color-mode" value="source">切换原稿系统配色</button>
      <div class="sex-row">
        <label for="reproductive">生殖分层</label>
        <select id="reproductive" aria-label="生殖器官分层">
          <option value="none" selected>隐藏</option>
          <option value="testes">睾丸示意层</option>
          <option value="uterus">子宫示意层</option>
        </select>
      </div>
      <p id="source-legend">亮色仅表示文献关联，不是个人反应。</p>
    </section>

    <section class="group">
      <h3>系统分层</h3>
      <div class="layers">
        <div class="sys-item">
          <div class="sys-item-left">
            <span class="color-dot" style="background:#9FB3BD"></span>
            <label for="sys-skin">外壳</label>
          </div>
          <input type="checkbox" id="sys-skin" checked />
        </div>

        <div class="sys-item">
          <div class="sys-item-left">
            <span class="color-dot" style="background:#D9D3C5"></span>
            <label for="sys-ske">骨骼</label>
          </div>
          <input type="checkbox" id="sys-ske" checked />
        </div>

        <div class="sys-item">
          <div class="sys-item-left">
            <span class="color-dot" style="background:#C98A80"></span>
            <label for="sys-cir">循环</label>
          </div>
          <input type="checkbox" id="sys-cir" checked />
        </div>

        <div class="sys-item">
          <div class="sys-item-left">
            <span class="color-dot" style="background:#86A9BA"></span>
            <label for="sys-res">呼吸</label>
          </div>
          <input type="checkbox" id="sys-res" checked />
        </div>

        <div class="sys-item">
          <div class="sys-item-left">
            <span class="color-dot" style="background:#C2A678"></span>
            <label for="sys-dig">消化</label>
          </div>
          <input type="checkbox" id="sys-dig" checked />
        </div>

        <div class="sys-item">
          <div class="sys-item-left">
            <span class="color-dot" style="background:#A79BC4"></span>
            <label for="sys-ner">神经</label>
          </div>
          <input type="checkbox" id="sys-ner" checked />
        </div>

        <div class="sys-item">
          <div class="sys-item-left">
            <span class="color-dot" style="background:#82AE99"></span>
            <label for="sys-uri">泌尿</label>
          </div>
          <input type="checkbox" id="sys-uri" checked />
        </div>
      </div>
    </section>

    <details class="group">
      <summary>视图</summary>

      <div class="slider-wrap">
        <label>人体外壳透明度 <span id="skin-val">0.16</span></label>
        <input type="range" id="skin-opacity" min="0" max="0.9" step="0.05" value="0.16" />
      </div>

      <div class="slider-wrap">
        <label>器官层透明度 <span id="organ-val">0.85</span></label>
        <input type="range" id="organ-opacity" min="0.2" max="1" step="0.05" value="0.85" />
      </div>

      <div class="slider-wrap">
        <label>证据蒙版强度 <span id="glow-val">1.2</span></label>
        <input type="range" id="glow" min="0" max="2.5" step="0.1" value="1.2" />
      </div>

      <div class="btn-row">
        <button class="btn" id="resetCam">重置视角</button>
        <button class="btn" id="autoRotate">自动旋转</button>
      </div>
    </details>

    <section class="group info" id="info">
      <h4>器官信息</h4>
      <p>HTML 原稿示意几何；点击器官联动右侧证据。显示不构成生理指标测量。</p>
      <div class="tag-row">
        <span class="tag">拖拽旋转</span>
        <span class="tag">滚轮缩放</span>
        <span class="tag">分层显隐</span>
      </div>
    </section>
  </aside>

  <div id="canvas-wrap">
    <div class="loading" id="loading">加载人体模型中…</div>
    <canvas id="three-canvas"></canvas>
    <div id="viewport-status">正在准备渲染</div>
    <div class="hint">拖拽旋转 · 右键平移 · 滚轮缩放 · 点击器官查看证据</div>
  </div>
</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script type="module" src="./scene.mjs"></script>
</body></html>
